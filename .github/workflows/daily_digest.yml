name: AI Daily Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python runtime
        run: |
          python --version
          python -c "import sys; print(f'Python executable: {sys.executable}'); print(f'Python version: {sys.version}')"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Run daily digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_DAILY_CONFIG_DIR: ${{ github.workspace }}/config
          AI_DAILY_DATA_DIR: ${{ github.workspace }}/data
          AI_DAILY_OUTPUT_DIR: ${{ github.workspace }}/output
          FILTER_PROVIDER: ${{ vars.FILTER_PROVIDER }}
          FILTER_MODEL: ${{ vars.FILTER_MODEL }}
          NEWS_ANALYSIS_PROVIDER: ${{ vars.NEWS_ANALYSIS_PROVIDER }}
          NEWS_ANALYSIS_MODEL: ${{ vars.NEWS_ANALYSIS_MODEL }}
          PAPER_ANALYSIS_PROVIDER: ${{ vars.PAPER_ANALYSIS_PROVIDER }}
          PAPER_ANALYSIS_MODEL: ${{ vars.PAPER_ANALYSIS_MODEL }}
          SOCIAL_ANALYSIS_PROVIDER: ${{ vars.SOCIAL_ANALYSIS_PROVIDER }}
          SOCIAL_ANALYSIS_MODEL: ${{ vars.SOCIAL_ANALYSIS_MODEL }}
          DIGEST_PROVIDER: ${{ vars.DIGEST_PROVIDER }}
          DIGEST_MODEL: ${{ vars.DIGEST_MODEL }}
        run: python -m ai_daily.main --send --debug
      - name: Persist sent history
        run: |
          if [ ! -f data/seen_items.json ]; then
            echo "No history state was written; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_items.json
          if git diff --cached --quiet; then
            echo "History state unchanged; no commit created."
            exit 0
          fi
          git commit -m "chore: update AI Daily state [skip ci]"
          git push
